<!doctype html>
<html>
  <head>
    <title>Orders</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="main">

      <!-- Sidebar -->
      <div class="sidebar">
        <h2 class="logo">Apex</h2>

        <ul>
          <li>
            <a href="index.html">
              <span class="nav-icon">🏠</span> Dashboard
            </a>
          </li>
          <li>
            <a href="orders.html" class="active">
              <span class="nav-icon">📦</span> Orders
            </a>
          </li>
        </ul>

        <div class="profile">
          <div class="profile-avatar">AS</div>
          <p>Admin</p>
        </div>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Topbar -->
        <div class="topbar">
          <input type="text" placeholder="Search..." />

          <div class="top-actions">
            <a href="new-order.html" class="btn">+ New Order</a>
            <span class="avatar">AS</span>
          </div>
        </div>

        <!-- Page Content -->
        <div class="page">
          <h1>Orders</h1>
          <p class="subtitle">Manage and track all customer orders.</p>

          <div class="table-section">

            <!-- Section header (future filters/search can go here) -->
            <div class="section-header">
              <h3>All Orders</h3>
            </div>

            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer</th>
                  <th>Product</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th>Amount</th>
                </tr>
              </thead>

              <tbody id="orderTable">
                <!-- JS will populate -->
              </tbody>
            </table>

          </div>
        </div>

      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
